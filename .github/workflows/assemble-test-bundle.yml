# SPDX-License-Identifier: MPL-2.0
name: Assemble synthetic test bundle
on:
  push:
    branches: [codex/synthetic-0.2.0-export-20261107]
    paths: [.github/workflows/assemble-test-bundle.yml]
permissions:
  contents: read
jobs:
  assemble:
    if: github.repository == 'Sandro6880/Accounting-Assistant'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No checkout or application code execution with the release-write token.
      # The cloud upload gateway accepts smaller requests; assemble verified
      # transfer parts on GitHub and keep the release a draft.
      - name: Assemble, upload and read back the exact draft asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path

          tag = "v0.2.0-synthetic-test-20261107"
          name = "Accounting-Assistant-0.2.0-complete.zip"
          source_commit = "b0c2c8770ab0187ba72c401673a413cfd22350b3"
          expected_size = 159015587
          expected_sha = "8e1db54c0ce46e2e23e702ea428ed556b60d4a4bffedc77928b0d65d8db958d6"
          manifest_name = "Accounting-Assistant-0.2.0-transfer.json"
          repo = os.environ["GH_REPO"]
          work = Path(os.environ["RUNNER_TEMP"]) / "accounting-synthetic-transfer"
          work.mkdir()

          def gh(*args):
              return subprocess.check_output(["gh", *args, "--repo", repo], text=True)

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))

          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()

          release = api(f"repos/{repo}/releases/tags/{tag}")
          assert release["draft"] and release["target_commitish"] == source_commit
          assert not any(a["name"] == name for a in release["assets"]), "Complete asset already exists; do not overwrite it"
          gh("release", "download", tag, "--pattern", name + ".part-*", "--pattern", manifest_name, "--dir", str(work))
          manifest = json.loads((work / manifest_name).read_text())
          assert (manifest["name"], manifest["size"], manifest["sha256"]) == (name, expected_size, expected_sha)
          assert [p["name"] for p in manifest["parts"]] == [f"{name}.part-{i:05d}" for i in range(1, 39)]
          combined = work / name
          with combined.open("xb") as output:
              for part in manifest["parts"]:
                  path = work / part["name"]
                  assert path.stat().st_size == part["size"] and digest(path) == part["sha256"]
                  with path.open("rb") as stream:
                      while block := stream.read(1024 * 1024):
                          output.write(block)
          assert combined.stat().st_size == expected_size and digest(combined) == expected_sha
          with zipfile.ZipFile(combined) as archive:
              assert archive.testzip() is None
          gh("release", "upload", tag, str(combined))
          verify = work / "read-back"
          verify.mkdir()
          gh("release", "download", tag, "--pattern", name, "--dir", str(verify))
          assert digest(verify / name) == expected_sha
          assert api(f"repos/{repo}/releases/{release['id']}")["draft"]
          print(f"Verified uploaded draft asset: {name}; {expected_size} bytes; SHA-256 {expected_sha}")
          PY
